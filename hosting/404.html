<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Page not found | Hoyst</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: #fff;
        background: #090b12;
      }
      main {
        max-width: 520px;
      }
      img {
        width: 120px;
        margin-bottom: 32px;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        margin: 0 0 14px;
        letter-spacing: -0.04em;
      }
      p {
        color: #b4bcd1;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 22px;
        border-radius: 999px;
        color: #fff;
        background: #5a1cff;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/hoyst-logo.png" alt="Hoyst" />
      <h1>Page not found</h1>

      <a href="/">Go to Hoyst</a>
